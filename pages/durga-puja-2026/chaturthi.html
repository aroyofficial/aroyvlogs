<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Chaturthi · Durga Puja 2026</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../../css/style.css" />
		<link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
		<script
			src="https://kit.fontawesome.com/121e47ea8d.js"
			crossorigin="anonymous"
		></script>
		<style>
			.route-actions {
				display: flex;
				flex-direction: column;
				gap: 8px;
				align-items: flex-end;
			}
			.route-actions .map-btn {
				width: max-content;
			}
			.pandal {
				cursor: pointer;
				transition:
					box-shadow 0.2s ease,
					transform 0.2s ease;
			}
			.pandal:hover {
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
				transform: translateY(-1px);
			}
			.pandal[aria-expanded="true"] {
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			}
			.itinerary-item-expansion-panel {
				display: grid;
				grid-template-rows: 0fr;
				transition: grid-template-rows 0.25s ease;
				margin-top: 0;
			}
			.itinerary-item-expansion-panel.is-open {
				grid-template-rows: 1fr;
				margin-top: 14px;
			}
			.itinerary-item-expansion-panel > div {
				overflow: hidden;
			}
			.itinerary-item-expansion-panel-body {
				padding: 0;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 14px;
				line-height: 1.6;
			}
			.itinerary-item-expansion-panel.is-open
				.itinerary-item-expansion-panel-body {
				padding-top: 14px;
			}
			.pandal .route-actions {
				position: relative;
				z-index: 2;
			}
			.pandal .route-actions a {
				cursor: pointer;
			}
			@media (max-width: 575.98px) {
				.route-actions {
					flex-direction: row;
					justify-content: flex-start;
					align-items: flex-start;
					gap: 8px;
				}
				.route-actions .map-btn {
					width: max-content;
				}
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="site-header-inner">
				<a class="brand" href="../../">
					<span class="brand-icon">✦</span>
					<span>
						<strong>Vlogs with Arijit</strong>
						<small>Durga Puja 2026</small>
					</span>
				</a>
				<a class="btn btn-dark rounded-pill" href="index.html">← Puja days</a>
			</div>
		</header>
		<div id="puja-day-main-root" data-page="chaturthi"></div>
		<footer class="site-footer">
			<div>
				<strong>Vlogs with Arijit</strong
				><span>Durga Puja 2026 · Chaturthi</span>
			</div>
			<a class="text-link" href="index.html">All Puja days</a>
		</footer>
		<script type="module" src="main.js"></script>
		<script src="route-enhancements.js"></script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				document.querySelectorAll(".pandal").forEach((card) => {
					card.addEventListener("click", (event) => {
						if (event.target.closest("a")) return;
						const open = card.getAttribute("aria-expanded") === "true";
						document
							.querySelectorAll('.pandal[aria-expanded="true"]')
							.forEach((other) => {
								if (other === card) return;
								other.setAttribute("aria-expanded", "false");
								const panel = other.querySelector(
									".itinerary-item-expansion-panel",
								);
								if (panel) {
									panel.classList.remove("is-open");
									panel.setAttribute("aria-hidden", "true");
								}
							});
						card.setAttribute("aria-expanded", String(!open));
						const panel = card.querySelector(".itinerary-item-expansion-panel");
						if (panel) {
							panel.classList.toggle("is-open", !open);
							panel.setAttribute("aria-hidden", String(open));
						}
					});
				});
			});
		</script>
	</body>
</html>
