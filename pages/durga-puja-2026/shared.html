<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#111" />
		<title>Durga Puja 2026 · Puja day</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../../css/style.css" />
		<link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
		<script
			src="https://kit.fontawesome.com/121e47ea8d.js"
			crossorigin="anonymous"
		></script>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		/>
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
		<style>
			.route-actions {
				display: flex;
				flex-direction: column;
				gap: 8px;
				align-items: flex-end;
			}
			.route-actions .map-btn {
				width: max-content;
			}
			.pandal {
				cursor: pointer;
				transition:
					box-shadow 0.2s ease,
					transform 0.2s ease;
			}
			.pandal:hover {
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
				transform: translateY(-1px);
			}
			.pandal[aria-expanded="true"] {
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			}
			.itinerary-item-expansion-panel {
				display: grid;
				grid-template-rows: 0fr;
				transition: grid-template-rows 0.25s ease;
				margin-top: 0;
			}
			.itinerary-item-expansion-panel.is-open {
				grid-template-rows: 1fr;
				margin-top: 14px;
			}
			.itinerary-item-expansion-panel > div {
				overflow: hidden;
			}
			.itinerary-item-expansion-panel-body {
				padding: 0;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 14px;
				line-height: 1.6;
			}
			.itinerary-item-expansion-panel.is-open
				.itinerary-item-expansion-panel-body {
				padding-top: 14px;
			}
			.pandal .route-actions {
				position: relative;
				z-index: 2;
			}
			.pandal .route-actions a {
				cursor: pointer;
			}
			@media (max-width: 575.98px) {
				.route-actions {
					flex-direction: row;
					justify-content: flex-start;
					align-items: flex-start;
					gap: 8px;
				}
				.route-actions .map-btn {
					width: max-content;
				}
			}
		</style>
	</head>
	<body>
		<div id="page-header-root"></div>
		<div id="puja-day-main-root"></div>
		<div id="page-footer-root"></div>
		<script type="module" src="./scripts/main.js"></script>
	</body>
</html>
