name: Repair Navami final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize malformed Navami block
        run: |
          python3 -c "from pathlib import Path; p=Path('pages/durga-puja-2026/route-enhancements.js'); s=p.read_text(encoding='utf-8'); marker='/* NAVAMI_DESCRIPTION_FIX_V1 */'; prefix, suffix=s.split(marker,1); suffix=suffix.replace('\\\\n','\\n').replace('\\\\','\\'); p.write_text(prefix.rstrip()+'\\n\\n'+marker+suffix,encoding='utf-8')"
      - name: Validate JavaScript
        run: node --check pages/durga-puja-2026/route-enhancements.js
      - name: Commit fix and remove temporary workflows
        run: |
          rm -f .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml
          git commit -m "fix: repair Navami JS syntax"
          git push
