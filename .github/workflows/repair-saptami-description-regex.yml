name: Repair Saptami description regex

on:
  push:
    paths:
      - '.github/workflows/repair-saptami-description-regex.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair JS and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/durga-puja-2026/route-enhancements.js')
          text=p.read_text(encoding='utf-8')
          old=r'if(!/\\/saptami\\.html$/i)return;'
          new=r'if(!/\/saptami\.html$/i)return;'
          if old not in text:
              raise SystemExit('Expected Saptami regex was not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/repair-saptami-description-regex.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/repair-saptami-description-regex.yml
          git commit -m 'fix: repair Saptami description path check'
          git push