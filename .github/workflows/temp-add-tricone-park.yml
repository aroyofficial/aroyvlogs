name: Temporary add Tricone Park

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Chaturthi route
        run: |
          python3 -c 'import base64;exec(base64.b64decode(""))'
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temp-add-tricone-park.yml
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/temp-add-tricone-park.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add Tricone Park to Chaturthi route'
          git push origin HEAD:main
