name: Ensure favicon on all pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ensure-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Navami descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('pages/durga-puja-2026/route-enhancements.js')
          helper = Path('pages/durga-puja-2026/navami-descriptions-final.js')
          text = route.read_text(encoding='utf-8')
          block = helper.read_text(encoding='utf-8').strip()
          route.write_text(text.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          print('Navami descriptions appended')
          PY

      - name: Validate Navami JavaScript
        run: node --check pages/durga-puja-2026/route-enhancements.js

      - name: Add favicon to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          favicon = 'https://aroyofficial.github.io/aroyvlogs/favicon.svg'
          link = f'<link rel="icon" type="image/svg+xml" href="{favicon}">'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'rel="icon"' in text.lower() or "rel='icon'" in text.lower():
                  continue
              head_end = text.lower().find('</head>')
              if head_end == -1:
                  continue
              text = text[:head_end] + link + text[head_end:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Favicon added to:', ', '.join(changed) if changed else 'no pages needed changes')
          PY

      - name: Commit permanent Navami fix and restore workflow
        run: |
          rm -f pages/durga-puja-2026/navami-descriptions-final.js
          git checkout -- .github/workflows/ensure-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: inject Navami descriptions [skip ci]"
          git push
