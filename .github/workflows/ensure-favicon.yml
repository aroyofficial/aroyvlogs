name: Ensure favicon on all pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ensure-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add favicon to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          favicon = 'https://aroyofficial.github.io/aroyvlogs/favicon.svg'
          link = f'<link rel="icon" type="image/svg+xml" href="{favicon}">'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'rel="icon"' in text.lower() or "rel='icon'" in text.lower():
                  continue
              head_end = text.lower().find('</head>')
              if head_end == -1:
                  continue
              text = text[:head_end] + link + text[head_end:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Favicon added to:', ', '.join(changed) if changed else 'no pages needed changes')
          PY

      - name: Add requested Chaturthi transfer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/durga-puja-2026/route-enhancements.js')
          text = path.read_text(encoding='utf-8')
          marker = "      mudialiStep.after(triconeStep);"
          transfer = "      const triconeTransfer=document.createElement('li');\n      triconeTransfer.className='route-transport';\n      triconeTransfer.dataset.chaturthiTriconeTransfer='true';\n      triconeTransfer.innerHTML='<strong>Transfer:</strong> Walk 290 m (5 mins) to <a class=\"route-location-link\" target=\"_blank\" rel=\"noopener\" href=\"https://maps.app.goo.gl/5MvJnw32sjB3Uh8Y7\">Tollygunge PS</a> → Then take a bus to <a class=\"route-location-link\" target=\"_blank\" rel=\"noopener\" href=\"https://maps.app.goo.gl/eovQE6JT1o9CP8jp7\">New Alipore Petrol Pump</a>.';\n      triconeStep.after(triconeTransfer);"
          if marker in text and 'data-chaturthi-tricone-transfer' not in text:
              text=text.replace(marker, marker+'\n'+transfer, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit favicon and route updates
        run: |
          if git diff --quiet; then
            echo "No updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Tricone Park transfer"
          git push
