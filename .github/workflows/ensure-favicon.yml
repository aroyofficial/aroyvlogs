name: Ensure favicon on all pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ensure-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean duplicate Navami description blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('pages/durga-puja-2026/route-enhancements.js')
          text = route.read_text(encoding='utf-8')
          marker = '/* NAVAMI_DESCRIPTION_FIX_V2 */'
          if marker in text:
              prefix, rest = text.split(marker, 1)
              rest_parts = rest.split(marker)
              text = prefix + marker + rest_parts[0]
              route.write_text(text.rstrip() + '\n', encoding='utf-8')
              print('Duplicate Navami blocks removed')
          else:
              print('No Navami description block found')
          PY

      - name: Validate Navami JavaScript
        run: node --check pages/durga-puja-2026/route-enhancements.js

      - name: Add favicon to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          favicon = 'https://aroyofficial.github.io/aroyvlogs/favicon.svg'
          link = f'<link rel="icon" type="image/svg+xml" href="{favicon}">'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'rel="icon"' in text.lower() or "rel='icon'" in text.lower():
                  continue
              head_end = text.lower().find('</head>')
              if head_end == -1:
                  continue
              text = text[:head_end] + link + text[head_end:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Favicon added to:', ', '.join(changed) if changed else 'no pages needed changes')
          PY

      - name: Commit cleanup and restore workflow
        run: |
          rm -f navami-repair-trigger.txt
          git checkout -- .github/workflows/ensure-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: clean duplicate Navami descriptions [skip ci]"
          git push
