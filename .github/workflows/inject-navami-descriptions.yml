name: Inject Navami descriptions
on:
  push:
    paths:
      - '.github/workflows/inject-navami-descriptions.yml'

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject descriptions and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('pages/durga-puja-2026/route-enhancements.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* NAVAMI_DESCRIPTION_FIX_V1 */'
          if marker not in s:
              block = r'''\n\n/* NAVAMI_DESCRIPTION_FIX_V1 */\n(function(){\n  const descriptions={\n    "Babubagan":"The 2026 preparations have begun with a <strong>renewed organising committee</strong>, following changes in the club's management. The Puja has a long-standing reputation for artistic and heritage-inspired presentations, but a reliable <strong>2026 theme and artist announcement is still awaited</strong>.",\n    "Selimpur Palli Sarbojanin":"A well-established South Kolkata community Puja with a history of traditional and artistic presentations. For <strong>2026</strong>, no sufficiently reliable theme or artist announcement has been found yet, so older creative details have deliberately not been carried forward.",\n    "Jodhpur Park":"Celebrating its <strong>75th year</strong>, the 2026 presentation is titled <strong>“Guptayan” (গুপ্তায়ন)</strong>, exploring the idea of something hidden or concealed beneath the surface. <strong>Biman Saha</strong> is credited with the planning and creation, with intriguing visual elements including a child, Durga's mask, lotus stems and an old Kolkata tram.",\n    "95 Palli Association":"A prominent South Kolkata Puja that continues its preparations for the 2026 festive season amid organisational and funding uncertainties affecting several large committees. A reliable final <strong>2026 theme and artist credit has not yet been confirmed</strong>, so no older theme information is being reused.",\n    "Karbagan":"The Puja is known for combining <strong>heritage character with detailed artistic craftsmanship</strong>. While current 2026 listings confirm its preparations, a reliable named theme or artist has not yet been established, and previous years' themes are intentionally excluded.",\n    "Pallishree":"An established community Puja in the Bidhannagar area. For <strong>2026</strong>, no sufficiently reliable theme or artist announcement has been found yet, so this description avoids carrying forward creative details from earlier editions.",\n    "Telengabagan":"Celebrating its <strong>61st year</strong>, the 2026 presentation is titled <strong>“Tilottama” (তিলোত্তমা)</strong>, drawing on the mythological celestial figure associated with extraordinary beauty and perfection. The idol is being created by <strong>Piyal Pal</strong>.",\n    "Surirbagan":"A neighbourhood Puja in the Bidhannagar area with an established community presence. A reliable <strong>2026 theme or artist announcement has not yet been confirmed</strong>, so no unsupported creative details are included here.",\n    "Sri Bhumi":"The 2026 presentation recreates the grandeur of Jaipur's iconic <strong>Hawa Mahal</strong>. The idol is being created by <strong>Pradip Rudrapal</strong>, while <strong>Gauri Decorators</strong> is handling the pandal execution. The architectural recreation is the central attraction of this year's presentation.",\n    "Natunpally Pradeep Sangha":"Known for its ambitious conceptual installations and collaborations with prominent artists over the years. For <strong>2026</strong>, however, a sufficiently reliable final theme or artist announcement has not been established, so historical themes and artist credits have not been carried forward.",\n    "Beliaghata 33 Palli":"Celebrating its <strong>25th year in 2026</strong>, the Puja continues its community celebrations in Beliaghata. A reliable final <strong>2026 theme and artist announcement is still awaited</strong>, so previous editions' creative concepts have not been presented as current information.",\n    "Sandhani Club":"A Beliaghata community Puja with a blend of <strong>traditional character and artistic craftsmanship</strong>. Current 2026 information confirms preparations, but a reliable named theme or artist has not yet been established.",\n    "IB Block":"An established Salt Lake Puja that is preparing for the 2026 festivities amid the funding and organisational challenges affecting several committees. The current information indicates that the <strong>2026 theme is still to be announced</strong>, so no previous year's theme is being reused.",\n    "FD Block":"The 2026 presentation is titled <strong>“Bindu” (বিন্দু)</strong>, with <strong>Prashanta Pal</strong> as the artist. The theme was announced during the committee's early 2026 preparations, making this one of Salt Lake's confirmed creative presentations for the year.",\n    "EC Block":"Celebrating its <strong>50th year</strong>, the Puja is taking an <strong>epic-inspired creative direction</strong> in 2026, with <strong>Samrat Bhattacharjee</strong> involved as the theme artist. The final named theme has not been reliably confirmed, so the description avoids assigning an unverified title.",\n    "AF Block":"An established Salt Lake community Puja. A reliable <strong>2026 theme or artist announcement has not yet been found</strong>, so older creative concepts have deliberately not been carried forward.",\n    "Newtown Sarbojonin":"The 2026 presentation is titled <strong>“Padma-bhushan”</strong>, with <strong>Rintu Das</strong> leading the artistic work. The lotus forms the central visual idea, with water, air, lotus buds and beehive-inspired elements incorporated into the installation. Five boats from Balagarh are being transformed into lotus-petal forms, with the largest rising to around <strong>45 feet</strong>.",\n    "Dum Dum Park Yubak Brinda":"Current 2026 reporting points towards a <strong>Santhal village-inspired presentation</strong>, celebrating elements of Santhal culture and artistic traditions. However, available sources contain conflicting information about the Puja's edition history, so these creative details should be treated as <strong>provisional until independently corroborated</strong>.",\n    "Dum Dum Park Sarbojanin":"The 2026 presentation is described in current Puja listings as having a <strong>traditional/Sabeki Ek-Chala character</strong>. A reliable named theme or artist has not yet been confirmed, so no older creative information is being presented as 2026 fact.",\n    "Dum Dum Park Bharat Chakra":"Celebrating its <strong>26th year</strong>, the 2026 presentation places emphasis on <strong>heritage, community and contemporary artistic expression</strong>. The committee's 2026 banner and Khuti Puja have already been publicised, although a formal named theme has not been reliably established.",\n    "Dum Dum Park Tarun Dal":"A long-running Dum Dum Park community Puja with a history of changing artistic presentations. For <strong>2026</strong>, no sufficiently reliable final theme or artist announcement has been found yet. This is kept separate from other nearby Tarun Sangha committees to avoid mixing their themes.",\n    "Dakshinpara":"A long-established Dum Dum Park-area Puja with a substantial history of artistic and socially conscious presentations. The committee's current 2026 material does not yet provide a reliable final theme or artist announcement, so previous concepts have not been carried forward.",\n    "Arjunpur Amra Sabai Club":"Known for ambitious conceptual and socially themed installations in previous years. For <strong>2026</strong>, the official theme has <strong>not yet been reliably announced</strong>, so older themes such as <em>Anyo-Desh</em> and <em>Ganadebata</em> are intentionally excluded."\n  };\n  function fix(){\n    if(!/\\/navami\\.html$/i.test(location.pathname))return;\n    document.querySelectorAll('.route-list > .route-step .route-card').forEach(function(card){\n      if(card.classList.contains('route-lunch')||/\\bLUNCH\\b/i.test(card.textContent))return;\n      const title=card.querySelector('h3')?.textContent.trim();\n      const description=descriptions[title];\n      if(!description)return;\n      card.classList.add('puja-pandal');\n      let panel=card.querySelector('.puja-pandal-expansion');\n      if(!panel){\n        panel=document.createElement('div');\n        panel.className='puja-pandal-expansion';\n        panel.setAttribute('aria-hidden','true');\n        const inner=document.createElement('div');\n        const content=document.createElement('div');\n        content.className='puja-pandal-expansion-content';\n        inner.appendChild(content); panel.appendChild(inner); card.appendChild(panel);\n      }\n      let content=panel.querySelector('.puja-pandal-expansion-content');\n      if(!content){\n        content=document.createElement('div'); content.className='puja-pandal-expansion-content';\n        let inner=panel.querySelector(':scope > div');\n        if(!inner){inner=document.createElement('div');panel.appendChild(inner);}\n        inner.appendChild(content);\n      }\n      content.innerHTML=description;\n    });\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(fix,0);},{once:true});\n  else setTimeout(fix,0);\n})();\n'''
              p.write_text(s+block,encoding='utf-8')
          wf=Path('.github/workflows/inject-navami-descriptions.yml')
          wf.unlink()
      - name: Commit permanent JS change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/inject-navami-descriptions.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: inject Navami pandal descriptions"
          git push
