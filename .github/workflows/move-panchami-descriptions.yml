name: Move Panchami descriptions into expansion panels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move descriptions into expansion panels
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pages/durga-puja-2026/panchami.html')
          s = p.read_text(encoding='utf-8')

          # Move each existing description into the permanent expansion-panel markup.
          pattern = re.compile(r'<div class="route-description">(.*?)</div>')
          count = 0
          def move(m):
              nonlocal_count[0] += 1
              return '<div class="puja-pandal-expansion" aria-hidden="true"><div><div class="puja-pandal-expansion-content">' + m.group(1) + '</div></div></div>'
          nonlocal_count = [0]
          s = pattern.sub(move, s)
          count = nonlocal_count[0]

          # Replace the old JS that generated panels from .route-description with
          # behavior for the now-static .puja-pandal-expansion elements.
          js_pattern = re.compile(r'<script>document\.addEventListener\(\'DOMContentLoaded\',\(\)=>\{document\.querySelectorAll\(\'\.route-step \.route-card:not\(\.route-lunch\)\'\).*?</script>')
          new_js = '''<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.route-step .route-card:not(.route-lunch)').forEach(card=>{const panel=card.querySelector('.puja-pandal-expansion');if(!panel)return;card.classList.add('puja-pandal');card.setAttribute('aria-expanded','false');card.addEventListener('click',e=>{if(e.target.closest('a'))return;const open=card.getAttribute('aria-expanded')==='true';document.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(other=>{if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open))})})});</script>'''
          s, js_count = js_pattern.subn(new_js, s, count=1)
          if js_count != 1:
              raise SystemExit(f'Expected to replace exactly one expansion script, found {js_count}')
          if count != 23:
              raise SystemExit(f'Expected 23 route descriptions, moved {count}')

          p.write_text(s, encoding='utf-8')
          print(f'Moved {count} descriptions into expansion panels')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/move-panchami-descriptions.yml
          git commit -m "Move Panchami descriptions into expansion panels"
          git push
