name: Fix Panchami description placement
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: match Panchami description placement to Chaturthi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move descriptions outside route-top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/durga-puja-2026/panchami.html')
          s = path.read_text(encoding='utf-8')
          moved = 0

          while True:
              m = re.search(r'<div class="puja-pandal-expansion" aria-hidden="true">', s)
              if not m:
                  break
              start = m.start()
              depth = 0
              i = start
              end = None
              token = re.compile(r'<div(?:\s[^>]*)?>|</div>')
              for t in token.finditer(s, start):
                  if t.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = t.end()
                          break
              if end is None:
                  raise SystemExit('Could not find end of expansion block')

              block = s[start:end]
              before = s[:start]
              after = s[end:]

              top_start = before.rfind('<div class="route-top">')
              if top_start < 0:
                  raise SystemExit('Could not find route-top')

              # Find the matching closing div for route-top.
              depth = 0
              top_end = None
              for t in token.finditer(s, top_start):
                  if t.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          top_end = t.end()
                          break
              if top_end is None or top_end <= end:
                  raise SystemExit('Invalid route-top placement')

              # Remove the expansion from its current position, then insert it
              # immediately after route-top, matching Chaturthi exactly.
              s = s[:start] + s[end:]
              if top_end > end:
                  top_end -= (end - start)
              s = s[:top_end] + block + s[top_end:]
              moved += 1

          if moved != 23:
              raise SystemExit(f'Expected to move 23 descriptions, moved {moved}')

          path.write_text(s, encoding='utf-8')
          print(f'Moved {moved} descriptions to match Chaturthi placement')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/fix-panchami-description-placement.yml
          git commit -m "fix: match Panchami description placement to Chaturthi"
          git push
