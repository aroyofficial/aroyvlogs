name: Fix Panchami description placement
on:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move descriptions and commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "fix: match Panchami description placement to Chaturthi" ]; then
            echo "Already fixed - nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/durga-puja-2026/panchami.html')
          s = path.read_text(encoding='utf-8')
          token = re.compile(r'<div(?:\s[^>]*)?>|</div>')
          exp_re = re.compile(r'<div class="puja-pandal-expansion" aria-hidden="true">')
          matches = list(exp_re.finditer(s))
          if len(matches) != 23:
              raise SystemExit(f'Expected 23 expansion panels, found {len(matches)}')

          def matching_end(text, start):
              depth = 0
              for t in token.finditer(text, start):
                  if t.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return t.end()
              raise SystemExit('Could not find matching closing div')

          moved = 0
          for match in reversed(matches):
              exp_start = match.start()
              exp_end = matching_end(s, exp_start)
              top_start = s.rfind('<div class="route-top">', 0, exp_start + 1)
              if top_start < 0:
                  raise SystemExit('Could not find route-top')
              top_end = matching_end(s, top_start)
              if not (top_start < exp_start < exp_end <= top_end):
                  raise SystemExit('Expansion is not inside route-top')

              block = s[exp_start:exp_end]
              s = s[:exp_start] + s[exp_end:]
              top_end -= exp_end - exp_start
              s = s[:top_end] + block + s[top_end:]
              moved += 1

          if '<div class="route-description">' in s:
              raise SystemExit('route-description elements found')
          remaining_inside = 0
          for m in exp_re.finditer(s):
              before = s[:m.start()]
              top_start = before.rfind('<div class="route-top">')
              if top_start >= 0 and matching_end(s, top_start) > m.start():
                  remaining_inside += 1
          if remaining_inside:
              raise SystemExit(f'{remaining_inside} expansion panels remain inside route-top')

          path.write_text(s, encoding='utf-8')
          print(f'Moved {moved} expansion panels outside route-top')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/fix-panchami-description-placement.yml
          git commit -m "fix: match Panchami description placement to Chaturthi"
          git push
