name: Apply Navami helper

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace malformed Navami block
        run: python3 -c "from pathlib import Path; p=Path('pages/durga-puja-2026/route-enhancements.js'); h=Path('pages/durga-puja-2026/navami-descriptions-fix.js').read_text(encoding='utf-8'); s=p.read_text(encoding='utf-8'); m='/* NAVAMI_DESCRIPTION_FIX_V1 */'; q=chr(92); nl=chr(10); a=s.split(m,1)[0].rstrip(); a=a.rstrip(q+'n'); p.write_text(a+nl+nl+h,encoding='utf-8')"
      - name: Validate JavaScript
        run: node --check pages/durga-puja-2026/route-enhancements.js
      - name: Commit permanent fix and remove temporary files
        run: |
          rm -f pages/durga-puja-2026/navami-descriptions-fix.js .github/workflows/apply-navami-helper.yml .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml .github/workflows/repair-navami-final-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/route-enhancements.js pages/durga-puja-2026/navami-descriptions-fix.js .github/workflows/apply-navami-helper.yml .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml .github/workflows/repair-navami-final-v2.yml
          git commit -m "fix: repair Navami descriptions JavaScript"
          git push
# trigger apply retry
