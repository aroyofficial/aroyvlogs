name: Repair Navami final v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize malformed Navami block
        run: python3 -c "from pathlib import Path; p=Path('pages/durga-puja-2026/route-enhancements.js'); s=p.read_text(encoding='utf-8'); m='/* NAVAMI_DESCRIPTION_FIX_V1 */'; a,b=s.split(m,1); q=chr(92); nl=chr(10); b=b.replace(q+q+'n',nl).replace(q+q,q).replace(q+'n',nl); p.write_text(a.rstrip()+nl+nl+m+b,encoding='utf-8')"
      - name: Validate JavaScript
        run: node --check pages/durga-puja-2026/route-enhancements.js
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml .github/workflows/repair-navami-final-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/repair-navami-syntax.yml .github/workflows/fix-navami-js-v2.yml .github/workflows/finalize-navami-repair.yml .github/workflows/repair-navami-final.yml .github/workflows/repair-navami-final-v2.yml
          git commit -m "fix: repair Navami JS syntax"
          git push
# trigger repair retry
