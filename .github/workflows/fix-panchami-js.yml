name: Fix Panchami JS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-js.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Chaturthi-style Panchami panel behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/durga-puja-2026/panchami.html')
          s=p.read_text()
          new="""<script>(function(){function initPujaPanels(){document.querySelectorAll('.route-list').forEach(function(list){if(list.dataset.pujaPanelsBound==='true')return;list.dataset.pujaPanelsBound='true';list.addEventListener('click',function(e){const card=e.target.closest('.route-card.puja-pandal');if(!card||!list.contains(card)||e.target.closest('a'))return;const panel=card.querySelector('.puja-pandal-expansion');if(!panel)return;const open=card.getAttribute('aria-expanded')==='true';list.querySelectorAll('.route-card.puja-pandal[aria-expanded=\"true\"]').forEach(function(other){if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open));});});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initPujaPanels);}else{initPujaPanels();}})();</script>"""
          pattern=re.compile(r'<script>document\.addEventListener\([\s\S]*?</script>')
          matches=list(pattern.finditer(s))
          if not matches: raise SystemExit('Panchami panel script not found')
          p.write_text(s[:matches[-1].start()]+new+s[matches[-1].end():])
          PY
      - name: Commit Panchami fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git commit -m 'fix: match Chaturthi expansion panel behavior'
          git rm .github/workflows/fix-panchami-js.yml
          git commit -m 'chore: remove temporary Panchami JS workflow'
          git push origin main
