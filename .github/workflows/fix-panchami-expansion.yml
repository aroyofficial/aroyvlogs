name: Fix Panchami expansion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add expansion panels to Panchami
        shell: python
        run: |
          from pathlib import Path
          p = Path('pages/durga-puja-2026/panchami.html')
          s = p.read_text(encoding='utf-8')
          if 'puja-pandal-expansion' not in s:
              marker = '</head>'
              style = '<style>.route-card.puja-pandal{cursor:pointer}.route-card.puja-pandal[aria-expanded="true"]{box-shadow:0 10px 30px rgba(0,0,0,.08)}.puja-pandal-expansion{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin-top:0}.puja-pandal-expansion.is-open{grid-template-rows:1fr;margin-top:14px}.puja-pandal-expansion>div{overflow:hidden}.puja-pandal-expansion-content{padding:0;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6}.puja-pandal-expansion.is-open .puja-pandal-expansion-content{padding-top:14px}</style>'
              s = s.replace(marker, style + marker, 1)
              script = '''<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.route-step .route-card:not(.route-lunch)').forEach(card=>{const desc=card.querySelector('.route-description');if(!desc||card.querySelector('.puja-pandal-expansion'))return;card.classList.add('puja-pandal');card.setAttribute('aria-expanded','false');const panel=document.createElement('div');panel.className='puja-pandal-expansion';panel.setAttribute('aria-hidden','true');const inner=document.createElement('div');const content=document.createElement('div');content.className='puja-pandal-expansion-content';content.innerHTML=desc.innerHTML;inner.appendChild(content);panel.appendChild(inner);desc.remove();const top=card.querySelector('.route-top');if(top)top.insertAdjacentElement('afterend',panel);card.addEventListener('click',e=>{if(e.target.closest('a'))return;const open=card.getAttribute('aria-expanded')==='true';document.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(other=>{if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open))})})});</script>'''
              s = s.replace('</body>', script + '</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/fix-panchami-expansion.yml
          git commit -m "Fix Panchami pandal expansion panels"
          git push
