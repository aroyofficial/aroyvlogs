name: Style Chaturthi transfer walking steps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  style-transfers:
    if: github.event.head_commit.message != 'Style Chaturthi transfer walking steps [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Normalize Chaturthi transfer walking steps
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/durga-puja-2026/route-enhancements.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "Walk back 550 m (11 min) to <a": "🚶 550 m · ⏱️ 11 min to <a",
              "Walk 290 m (5 mins) to <a": "🚶 290 m · ⏱️ 5 mins to <a",
              "Walk 210 m (5 mins) to <a": "🚶 210 m · ⏱️ 5 mins to <a",
              "Walk 140 m (3 min) to <a": "🚶 140 m · ⏱️ 3 min to <a",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temp-style-chaturthi-transfers.yml
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/temp-style-chaturthi-transfers.yml
          git commit -m "Style Chaturthi transfer walking steps [skip ci]"
          git push
