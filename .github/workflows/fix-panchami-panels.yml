name: Fix Panchami expansion panels

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: make Panchami expansion panels match Chaturthi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Make Panchami panels match Chaturthi
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pages/durga-puja-2026/panchami.html')
          s = p.read_text(encoding='utf-8')

          # Make the 23 numbered pandal cards static expandable cards,
          # exactly like Chaturthi. Lunch/transfer cards are untouched.
          s, n = re.subn(
              r'(<li class="route-step"><span class="route-number">\d{2}</span><div class="route-card)(">)',
              r'\1 puja-pandal" aria-expanded="false">',
              s
          )
          if n != 23:
              raise SystemExit(f'Expected 23 numbered pandal cards, changed {n}')

          # Use the same panel CSS behaviour as Chaturthi.
          old_style = '<style>.route-card.puja-pandal{cursor:pointer}.route-card.puja-pandal[aria-expanded="true"]{box-shadow:0 10px 30px rgba(0,0,0,.08)}.puja-pandal-expansion{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin-top:0}.puja-pandal-expansion.is-open{grid-template-rows:1fr;margin-top:14px}.puja-pandal-expansion>div{overflow:hidden}.puja-pandal-expansion-content{padding:0;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6}.puja-pandal-expansion.is-open .puja-pandal-expansion-content{padding-top:14px}</style>'
          new_style = '<style>.puja-pandal{cursor:pointer;transition:box-shadow .2s ease,transform .2s ease}.puja-pandal:hover{box-shadow:0 10px 30px rgba(0,0,0,.08);transform:translateY(-1px)}.puja-pandal[aria-expanded="true"]{box-shadow:0 10px 30px rgba(0,0,0,.1)}.puja-pandal-expansion{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin-top:0}.puja-pandal-expansion.is-open{grid-template-rows:1fr;margin-top:14px}.puja-pandal-expansion>div{overflow:hidden}.puja-pandal-expansion-content{padding:0;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6}.puja-pandal-expansion.is-open .puja-pandal-expansion-content{padding-top:14px}.puja-pandal .route-actions{position:relative;z-index:2}.puja-pandal .route-actions a{cursor:pointer}</style>'
          if old_style not in s:
              raise SystemExit('Expected Panchami expansion style block not found')
          s = s.replace(old_style, new_style, 1)

          # Replace the Panchami-specific dynamic-card script with the same
          # static-card click behaviour used by Chaturthi.
          marker = '<script>document.addEventListener(\'DOMContentLoaded\',()=>{document.querySelectorAll(\'.route-step .route-card:not(.route-lunch)\')'
          start = s.rfind(marker)
          if start < 0:
              raise SystemExit('Expected Panchami panel script not found')
          end = s.find('</script>', start)
          if end < 0:
              raise SystemExit('Panel script closing tag not found')
          end += len('</script>')
          new_script = '''<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.route-card.puja-pandal').forEach(card=>{const panel=card.querySelector('.puja-pandal-expansion');if(!panel)return;card.addEventListener('click',e=>{if(e.target.closest('a'))return;const open=card.getAttribute('aria-expanded')==='true';document.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(other=>{if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open))})})});</script>'''
          s = s[:start] + new_script + s[end:]

          # Ensure every panel contains actual content and no legacy route-description remains.
          if s.count('class="puja-pandal-expansion-content"') != 23:
              raise SystemExit('Expected exactly 23 expansion descriptions')
          if 'route-description' in s:
              raise SystemExit('Legacy route-description element remains')

          p.write_text(s, encoding='utf-8')

      - name: Commit page and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/fix-panchami-panels.yml
          git commit -m 'fix: make Panchami expansion panels match Chaturthi'
          git push
