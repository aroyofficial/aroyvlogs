name: Fix Panchami click behavior
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-click.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match Chaturthi click implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pages/durga-puja-2026/panchami.html')
          s = p.read_text()
          script = '''<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.puja-pandal').forEach(card=>{card.addEventListener('click',event=>{if(event.target.closest('a'))return;const open=card.getAttribute('aria-expanded')==='true';document.querySelectorAll('.puja-pandal[aria-expanded="true"]').forEach(other=>{if(other===card)return;other.setAttribute('aria-expanded','false');const panel=other.querySelector('.puja-pandal-expansion');if(panel){panel.classList.remove('is-open');panel.setAttribute('aria-hidden','true');}});card.setAttribute('aria-expanded',String(!open));const panel=card.querySelector('.puja-pandal-expansion');if(panel){panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open));}});});});</script>'''
          pattern = re.compile(r'<script>\(function\(\)\{function initPujaPanels\(\)[\s\S]*?</script>\s*</body>')
          m = pattern.search(s)
          if not m:
              raise SystemExit('Current Panchami delegated panel script not found')
          s = s[:m.start()] + script + '</body>' + s[m.end():]
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git commit -m 'fix: match Chaturthi Panchami expansion clicks'
          git rm .github/workflows/fix-panchami-click.yml
          git commit -m 'chore: remove temporary Panchami click workflow'
          git push origin main
