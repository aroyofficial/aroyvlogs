name: Permanent Panchami panel JS fix

on:
  push:
    paths:
      - '.github/workflows/permanent-panchami-panel-js.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch route enhancements and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/durga-puja-2026/route-enhancements.js')
          s = p.read_text()
          marker = "  if(/\\/panchami\\.html$/i.test(location.pathname)){"
          if marker not in s:
              needle = "\\n});"
              handler = r'''\n  if(/\/panchami\.html$/i.test(location.pathname)){
    document.querySelectorAll('.route-list').forEach(list=>{
      if(list.dataset.pujaPanelsBound==='true')return;
      list.dataset.pujaPanelsBound='true';
      list.addEventListener('click',e=>{
        const card=e.target.closest('.route-card.puja-pandal');
        if(!card||!list.contains(card)||e.target.closest('a'))return;
        const panel=card.querySelector('.puja-pandal-expansion');
        if(!panel)return;
        e.stopPropagation();
        const open=card.getAttribute('aria-expanded')==='true';
        list.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(other=>{
          if(other===card)return;
          other.setAttribute('aria-expanded','false');
          const op=other.querySelector('.puja-pandal-expansion');
          if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true');}
        });
        card.setAttribute('aria-expanded',String(!open));
        panel.classList.toggle('is-open',!open);
        panel.setAttribute('aria-hidden',String(open));
      },true);
    });
  }
'''
              idx = s.rfind(needle)
              if idx < 0:
                  raise SystemExit('Could not find final DOMContentLoaded close')
              s = s[:idx] + handler + s[idx:]
              p.write_text(s)
          PY
          rm .github/workflows/permanent-panchami-panel-js.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/route-enhancements.js .github/workflows/permanent-panchami-panel-js.yml
          git diff --cached --check
          git commit -m 'fix: make Panchami expansion panels robust'
          git push
