name: Fix Panchami expansion structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-expansion-structure.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add robust Panchami expansion-panel behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/durga-puja-2026/panchami.html')
          s=p.read_text()
          script='''<script>(function(){function initPujaPanels(){document.querySelectorAll('.route-list').forEach(function(list){if(list.dataset.pujaPanelsBound==='true')return;list.dataset.pujaPanelsBound='true';list.addEventListener('click',function(e){const card=e.target.closest('.route-card.puja-pandal');if(!card||!list.contains(card)||e.target.closest('a'))return;const panel=card.querySelector('.puja-pandal-expansion');if(!panel)return;const open=card.getAttribute('aria-expanded')==='true';list.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(function(other){if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open));});});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initPujaPanels);}else{initPujaPanels();}})();</script>'''
          marker='</body>'
          if 'data-puja-panels-bound' not in s:
              s=s.replace(marker,script+marker)
          p.write_text(s)
          PY
      - name: Commit Panchami fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git commit -m 'fix: make Panchami expansion panels robust'
          git push
