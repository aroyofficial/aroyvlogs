name: Fix Panchami expansion structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-expansion-structure.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good Panchami and fix panel JS
        run: |
          git checkout 2c358e646feab19fc5c3bb5a490c161378179fc6 -- pages/durga-puja-2026/panchami.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/durga-puja-2026/panchami.html')
          s=p.read_text()
          old='<script>document.addEventListener(\'DOMContentLoaded\',()=>{document.querySelectorAll(\'.route-card.puja-pandal\').forEach(card=>{const panel=card.querySelector(\'.puja-pandal-expansion\');if(!panel)return;card.addEventListener(\'click\',e=>{if(e.target.closest(\'a\'))return;const open=card.getAttribute(\'aria-expanded\')===\'true\';document.querySelectorAll(\'.route-card.puja-pandal[aria-expanded="true"]\').forEach(other=>{if(other===card)return;other.setAttribute(\'aria-expanded\',\'false\');const op=other.querySelector(\'.puja-pandal-expansion\');if(op){op.classList.remove(\'is-open\');op.setAttribute(\'aria-hidden\',\'true\')}});card.setAttribute(\'aria-expanded\',String(!open));panel.classList.toggle(\'is-open\',!open);panel.setAttribute(\'aria-hidden\',String(open))})})});</script>'
          new='<script>(function(){function initPujaPanels(){const list=document.querySelector(\'.route-list\');if(!list||list.dataset.pujaPanelsBound===\'true\')return;list.dataset.pujaPanelsBound=\'true\';list.addEventListener(\'click\',function(e){const card=e.target.closest(\'.route-card.puja-pandal\');if(!card||!list.contains(card)||e.target.closest(\'a\'))return;const panel=card.querySelector(\'.puja-pandal-expansion\');if(!panel)return;const open=card.getAttribute(\'aria-expanded\')===\'true\';list.querySelectorAll(\'.route-card.puja-pandal[aria-expanded="true"]\').forEach(other=>{if(other===card)return;other.setAttribute(\'aria-expanded\',\'false\');const op=other.querySelector(\'.puja-pandal-expansion\');if(op){op.classList.remove(\'is-open\');op.setAttribute(\'aria-hidden\',\'true\')}});card.setAttribute(\'aria-expanded\',String(!open));panel.classList.toggle(\'is-open\',!open);panel.setAttribute(\'aria-hidden\',String(open));});}if(document.readyState===\'loading\')document.addEventListener(\'DOMContentLoaded\',initPujaPanels);else initPujaPanels();})();</script>'
          if old not in s: raise SystemExit('Expected original Panchami panel script not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git commit -m 'fix: use delegated JS for Panchami panels'
          git rm .github/workflows/fix-panchami-expansion-structure.yml .github/workflows/fix-panchami-js.yml
          git commit -m 'chore: remove temporary Panchami fix workflows'
          git push
