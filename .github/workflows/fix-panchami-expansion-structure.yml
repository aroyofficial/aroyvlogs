name: Fix Panchami expansion structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-expansion-structure.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize expansion markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pages/durga-puja-2026/panchami.html')
          s = p.read_text()
          pattern = re.compile(r'<div class="route-card"><div class="route-top">(<div>.*?<div class="puja-pandal-expansion" aria-hidden="true">.*?</div></div>)(<div class="route-actions">.*?</div></div>)</n          def repl(m):
              inner = m.group(1)
              actions = m.group(2)
              panel_start = inner.find('<div class="puja-pandal-expansion" aria-hidden="true">')
              panel = inner[panel_start:]
              before = inner[:panel_start]
              if before.endswith('</div>'):
                  before = before[:-6]
              # before now closes the content column; rebuild the route-top cleanly.
              return '<div class="route-card puja-pandal" aria-expanded="false"><div class="route-top">' + before + actions + '</div>' + panel + '</div>'
          new, n = pattern.subn(repl, s)
          if n != 23:
              raise SystemExit(f'Expected 23 Panchami pandal cards, transformed {n}')
          p.write_text(new)
          print(f'Normalized {n} Panchami expansion panels')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html .github/workflows/fix-panchami-expansion-structure.yml
          git commit -m 'fix: match Panchami expansion panel structure' || exit 0
          git rm .github/workflows/fix-panchami-expansion-structure.yml
          git commit -m 'chore: remove temporary Panchami fix workflow'
          git push