name: Fix Panchami expansion structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panchami-expansion-structure.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean duplicate Panchami expansion panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/durga-puja-2026/panchami.html')
          s=p.read_text()

          # Remove any expansion panel whose content is the old placeholder.
          placeholder=re.escape('Tap this card to expand. Detailed pandal notes can be placed here later.')
          s=re.sub(r'<div class="puja-pandal-expansion"[^>]*>\s*<div>\s*<div class="puja-pandal-expansion-content">\s*'+placeholder+r'\s*</div>\s*</div>\s*</div>', '', s)

          # Remove all previous inline Panchami panel handlers so only one remains.
          s=re.sub(r'<script>\(function\(\)\{function initPujaPanels\(\)[\s\S]*?</script>', '', s)
          s=re.sub(r'<script>document\.addEventListener\(\'DOMContentLoaded\',\(\)=>\{document\.querySelectorAll\(\'\.route-card\.puja-pandal\'\)[\s\S]*?</script>', '', s)

          script='''<script>(function(){function initPujaPanels(){document.querySelectorAll('.route-list').forEach(function(list){if(list.dataset.pujaPanelsBound==='true')return;list.dataset.pujaPanelsBound='true';list.addEventListener('click',function(e){const card=e.target.closest('.route-card.puja-pandal');if(!card||!list.contains(card)||e.target.closest('a'))return;const panels=card.querySelectorAll('.puja-pandal-expansion');panels.forEach(function(panel){const content=panel.querySelector('.puja-pandal-expansion-content');if(content&&content.textContent.trim()==='Tap this card to expand. Detailed pandal notes can be placed here later.')panel.remove();});const panel=card.querySelector('.puja-pandal-expansion');if(!panel)return;const open=card.getAttribute('aria-expanded')==='true';list.querySelectorAll('.route-card.puja-pandal[aria-expanded="true"]').forEach(function(other){if(other===card)return;other.setAttribute('aria-expanded','false');const op=other.querySelector('.puja-pandal-expansion');if(op){op.classList.remove('is-open');op.setAttribute('aria-hidden','true')}});card.setAttribute('aria-expanded',String(!open));panel.classList.toggle('is-open',!open);panel.setAttribute('aria-hidden',String(open));});});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initPujaPanels);}else{initPujaPanels();}})();</script>'''
          s=s.replace('</body>',script+'</body>')
          p.write_text(s)
          PY
      - name: Commit Panchami cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/durga-puja-2026/panchami.html
          git rm .github/workflows/fix-panchami-expansion-structure.yml
          git commit -m 'fix: remove duplicate Panchami expansion panels'
          git push
