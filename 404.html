<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#f7f4ee" />
		<meta name="robots" content="noindex" />
		<title>Page not found · Vlogs with Arijit</title>
		<style>
			:root {
				--ink: #171717;
				--paper: #f7f4ee;
				--card: #fffdf9;
				--line: #ddd7cd;
				--muted: #716d66;
				--accent: #b33a2d;
				--accent-soft: #ead8c9;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
			}
			.site-header {
				background: rgba(247, 244, 238, 0.94);
				border-bottom: 1px solid var(--line);
			}
			.site-header-inner {
				width: min(100%, 1480px);
				min-height: 76px;
				margin: auto;
				padding: 0 28px;
				display: flex;
				align-items: center;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 11px;
				color: var(--ink);
				text-decoration: none;
			}
			.brand-icon {
				width: 40px;
				height: 40px;
				border-radius: 12px;
				background: var(--ink);
				color: white;
				display: grid;
				place-items: center;
			}
			.brand strong,
			.brand small {
				display: block;
			}
			.brand strong {
				font-size: 15px;
			}
			.brand small {
				margin-top: 2px;
				color: var(--muted);
				font-size: 10px;
			}
			.eyebrow {
				color: var(--accent);
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 0.16em;
			}
			.not-found-page {
				min-height: calc(100vh - 76px);
				display: grid;
				place-items: center;
				padding: 48px 24px;
			}
			.not-found-card {
				position: relative;
				isolation: isolate;
				width: min(100%, 880px);
				overflow: hidden;
				padding: clamp(36px, 8vw, 84px);
				border: 1px solid var(--line);
				border-radius: 28px;
				background:
					radial-gradient(ellipse at 88% 12%, #ead8c9 0, transparent 35%),
					var(--card);
				box-shadow: 0 24px 70px rgba(43, 31, 20, 0.09);
			}
			.not-found-card::after {
				position: absolute;
				z-index: -1;
				right: 3%;
				bottom: -0.32em;
				color: rgba(179, 58, 45, 0.07);
				content: "✦";
				font-family: Georgia, serif;
				font-size: clamp(190px, 38vw, 390px);
				line-height: 1;
			}
			.not-found-code {
				margin: 16px 0 4px;
				color: var(--accent);
				font-family: Georgia, serif;
				font-size: clamp(100px, 21vw, 190px);
				letter-spacing: -0.09em;
				line-height: 0.9;
			}
			.not-found-card h1 {
				max-width: 560px;
				margin: 22px 0 12px;
				font-family: Georgia, serif;
				font-size: clamp(30px, 5vw, 48px);
				font-weight: 500;
				letter-spacing: -0.04em;
			}
			.not-found-card p {
				max-width: 520px;
				color: var(--muted);
				font-size: 16px;
				line-height: 1.75;
			}
			.not-found-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin-top: 28px;
			}
			.not-found-actions a {
				display: inline-flex;
				min-height: 46px;
				align-items: center;
				justify-content: center;
				padding: 0 20px;
				border: 1px solid var(--ink);
				border-radius: 999px;
				background: var(--ink);
				color: white;
				font-size: 14px;
				font-weight: 650;
				text-decoration: none;
				transition:
					transform 0.2s ease,
					background 0.2s ease;
			}
			.not-found-actions a:hover {
				transform: translateY(-2px);
				background: var(--accent);
				border-color: var(--accent);
			}
			.not-found-actions a.secondary {
				background: transparent;
				color: var(--ink);
			}
			.not-found-actions a.secondary:hover {
				color: white;
			}
			@media (max-width: 575.98px) {
				.not-found-page {
					min-height: calc(100vh - 68px);
					padding: 28px 16px;
				}
				.not-found-card {
					border-radius: 22px;
				}
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="site-header-inner">
				<a class="brand" href="#" data-site-path="/">
					<span class="brand-icon" aria-hidden="true">&#10022;</span>
					<span>
						<strong>Vlogs with Arijit</strong>
						<small>Stories, routes &amp; experiences</small>
					</span>
				</a>
			</div>
		</header>
		<main class="not-found-page">
			<section class="not-found-card" aria-labelledby="not-found-title">
				<span class="eyebrow">A WRONG TURN</span>
				<div class="not-found-code" aria-hidden="true">404</div>
				<h1 id="not-found-title">This page isn’t part of the journey.</h1>
				<p>
					The address may have changed, or the page may have taken a little
					detour. Let’s get you back to something worth exploring.
				</p>
				<nav class="not-found-actions" aria-label="Helpful links">
					<a href="#" data-site-path="/">Back to home <span aria-hidden="true">&nbsp;→</span></a>
					<a
						class="secondary"
						href="#"
						data-site-path="/pages/durga-puja-2026/index.html"
					>
						Explore the Puja calendar
					</a>
				</nav>
			</section>
		</main>
		<script>
			const siteBase = location.hostname.endsWith("github.io")
				? "/aroyvlogs"
				: "";
			document.querySelectorAll("[data-site-path]").forEach((link) => {
				link.href = `${siteBase}${link.dataset.sitePath}`;
			});
		</script>
	</body>
</html>
